<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSIMPIKE CUTZ | Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #1c1c1c 0%, #070707 55%);
            color: white;
            min-height: 100vh;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid #2b2b2b;
            background: rgba(5, 5, 5, 0.95);
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .logo span {
            color: #d4af37;
        }

        .logout {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout:hover {
            background: #d4af37;
            color: black;
        }

        .container {
            width: min(1100px, 92%);
            margin: 50px auto;
        }

        .login-box {
            max-width: 450px;
            margin: 100px auto;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .gold {
            color: #d4af37;
        }

        .login-box p {
            color: #999;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080808;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #d4af37;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #d4af37;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212,175,55,.2);
        }

        #loginMessage {
            margin-top: 15px;
            color: #ff5555;
            text-align: center;
        }

        .dashboard {
            display: none;
        }

        .dashboard-title {
            margin-bottom: 30px;
        }

        .dashboard-title h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .dashboard-title p {
            color: #888;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat {
            background: #111;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 25px;
        }

        .stat-title {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #d4af37;
            font-size: 32px;
            font-weight: bold;
        }

        .bookings-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .booking-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .booking-card:hover {
            border-color: #d4af37;
        }

        .booking-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .booking-name {
            font-size: 21px;
            font-weight: bold;
        }

        .booking-time {
            color: #d4af37;
            font-size: 22px;
            font-weight: bold;
        }

        .booking-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            color: #bbb;
            line-height: 1.6;
        }

        .booking-info strong {
            color: white;
        }

        .delete-button {
            margin-top: 20px;
            background: #351010;
            border: 1px solid #722222;
            color: #ff6666;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #551515;
        }

        .empty {
            text-align: center;
            padding: 50px;
            background: #111;
            border-radius: 15px;
            color: #888;
        }

        @media (max-width: 700px) {

            header {
                padding: 0 18px;
            }

            .logo {
                font-size: 18px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .booking-info {
                grid-template-columns: 1fr;
            }

            .booking-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        CSIMPIKE <span>CUTZ</span>
    </div>

    <button
        class="logout"
        id="logoutButton"
        onclick="logout()"
    >
        KIJELENTKEZÉS
    </button>

</header>


<!-- LOGIN -->

<div class="container">

    <div class="login-box" id="loginBox">

        <h1>
            CSIMPIKE <span class="gold">CUTZ</span>
        </h1>

        <p>
            Adminisztrációs felület
        </p>

        <form id="loginForm">

            <label for="password">
                Admin jelszó
            </label>

            <input
                type="password"
                id="password"
                placeholder="Írd be az admin jelszót"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                BELÉPÉS
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>


    <!-- DASHBOARD -->

    <div
        class="dashboard"
        id="dashboard"
    >

        <div class="dashboard-title">

            <h1>
                Admin <span class="gold">Dashboard</span>
            </h1>

            <p>
                CSIMPIKE CUTZ időpontfoglalások
            </p>

        </div>


        <!-- STATISZTIKÁK -->

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    ÖSSZES FOGLALÁS
                </div>

                <div
                    class="stat-value"
                    id="totalBookings"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    MAI FOGLALÁSOK
                </div>

                <div
                    class="stat-value"
                    id="todayBookings"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    KÖVETKEZŐ FOGLALÁS
                </div>

                <div
                    class="stat-value"
                    id="nextBooking"
                >
                    -
                </div>

            </div>

        </div>


        <!-- FOGLALÁSOK -->

        <div class="bookings-title">

            <h2>
                Foglalások
            </h2>

            <button
                class="refresh"
                onclick="loadBookings()"
            >
                ↻ FRISSÍTÉS
            </button>

        </div>


        <div id="bookingsList">

            <div class="empty">
                Foglalások betöltése...
            </div>

        </div>

    </div>

</div>


<script>

    let isLoggedIn = false;


    // ==========================================
    // LOGIN
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const loginMessage =
                document.getElementById("loginMessage");

            loginMessage.style.color = "#999";
            loginMessage.textContent =
                "Bejelentkezés...";


            try {

                const response = await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );


                const result =
                    await response.json();


                if (!response.ok) {

                    loginMessage.style.color =
                        "#ff5555";

                    loginMessage.textContent =
                        result.error ||
                        "Hibás jelszó.";

                    return;
                }


                // ==================================
                // SIKERES LOGIN
                // ==================================

                isLoggedIn = true;


                document
                    .getElementById("loginBox")
                    .style.display = "none";


                document
                    .getElementById("dashboard")
                    .style.display = "block";


                // KIJELENTKEZÉS GOMB MEGJELENÍTÉSE

                document
                    .getElementById("logoutButton")
                    .style.display = "block";


                document
                    .getElementById("password")
                    .value = "";


                loadBookings();

            }

            catch (error) {

                console.error(error);

                loginMessage.style.color =
                    "#ff5555";

                loginMessage.textContent =
                    "Nem sikerült kapcsolódni a szerverhez.";

            }

        });



    // ==========================================
    // FOGLALÁSOK BETÖLTÉSE
    // ==========================================

    async function loadBookings() {

        const list =
            document.getElementById("bookingsList");

        list.innerHTML = `
            <div class="empty">
                Foglalások betöltése...
            </div>
        `;


        try {

            const response =
                await fetch(
                    "/api/admin/bookings"
                );


            if (response.status === 401) {

                isLoggedIn = false;

                document
                    .getElementById("dashboard")
                    .style.display = "none";

                document
                    .getElementById("loginBox")
                    .style.display = "block";

                document
                    .getElementById("logoutButton")
                    .style.display = "none";

                return;
            }


            const result =
                await response.json();


            if (!result.success) {

                list.innerHTML = `
                    <div class="empty">
                        Hiba történt a foglalások betöltésekor.
                    </div>
                `;

                return;
            }


            const bookings =
                result.bookings || [];


            // ==================================
            // STATISZTIKÁK
            // ==================================

            document
                .getElementById("totalBookings")
                .textContent =
                bookings.length;


            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const todayBookings =
                bookings.filter(
                    booking =>
                        booking.date === today
                );


            document
                .getElementById("todayBookings")
                .textContent =
                todayBookings.length;


            // ==================================
            // KÖVETKEZŐ FOGLALÁS
            // ==================================

            const now =
                new Date();


            const futureBookings =
                bookings
                    .filter(booking => {

                        const dateTime =
                            new Date(
                                `${booking.date}T${booking.time}`
                            );

                        return dateTime >= now;

                    });


            if (futureBookings.length > 0) {

                const next =
                    futureBookings[0];

                document
                    .getElementById("nextBooking")
                    .textContent =
                    next.time;

            } else {

                document
                    .getElementById("nextBooking")
                    .textContent =
                    "-";

            }


            // ==================================
            // NINCS FOGLALÁS
            // ==================================

            if (bookings.length === 0) {

                list.innerHTML = `
                    <div class="empty">
                        Még nincs egyetlen foglalás sem.
                    </div>
                `;

                return;
            }


            // ==================================
            // FOGLALÁSOK KIRAJZOLÁSA
            // ==================================

            list.innerHTML = "";


            bookings.forEach(booking => {

                const card =
                    document.createElement("div");

                card.className =
                    "booking-card";


                card.innerHTML = `

                    <div class="booking-top">

                        <div class="booking-name">
                            ${escapeHtml(
                                booking.name
                            )}
                        </div>

                        <div class="booking-time">
                            ${escapeHtml(
                                booking.time
                            )}
                        </div>

                    </div>


                    <div class="booking-info">

                        <div>
                            <strong>Dátum:</strong>
                            ${escapeHtml(
                                booking.date
                            )}
                        </div>

                        <div>
                            <strong>Szolgáltatás:</strong>
                            ${escapeHtml(
                                booking.service ||
                                "Szolgáltatás"
                            )}
                        </div>

                        <div>
                            <strong>Telefon:</strong>
                            ${escapeHtml(
                                booking.phone
                            )}
                        </div>

                        <div>
                            <strong>E-mail:</strong>
                            ${escapeHtml(
                                booking.email
                            )}
                        </div>

                        <div>
                            <strong>Megjegyzés:</strong>
                            ${escapeHtml(
                                booking.note ||
                                "Nincs megjegyzés"
                            )}
                        </div>

                    </div>


                    <button
                        class="delete-button"
                        onclick="deleteBooking(${booking.id})"
                    >
                        🗑 FOGLALÁS TÖRLÉSE
                    </button>

                `;


                list.appendChild(card);

            });

        }

        catch (error) {

            console.error(error);

            list.innerHTML = `
                <div class="empty">
                    Nem sikerült kapcsolódni a szerverhez.
                </div>
            `;

        }

    }



    // ==========================================
    // FOGLALÁS TÖRLÉSE
    // ==========================================

    async function deleteBooking(id) {

        const confirmed =
            confirm(
                "Biztosan törölni szeretnéd ezt a foglalást?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/admin/bookings/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Nem sikerült törölni."
                );

                return;
            }


            loadBookings();

        }

        catch (error) {

            console.error(error);

            alert(
                "Nem sikerült kapcsolódni a szerverhez."
            );

        }

    }



    // ==========================================
    // KIJELENTKEZÉS
    // ==========================================

    async function logout() {

        try {

            await fetch(
                "/api/admin/logout",
                {
                    method: "POST"
                }
            );

        }

        catch (error) {

            console.error(error);

        }


        isLoggedIn = false;


        document
            .getElementById("dashboard")
            .style.display = "none";


        document
            .getElementById("loginBox")
            .style.display = "block";


        document
            .getElementById("logoutButton")
            .style.display = "none";


        document
            .getElementById("password")
            .value = "";


        document
            .getElementById("loginMessage")
            .textContent = "";

    }



    // ==========================================
    // BIZTONSÁGOS HTML
    // ==========================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
