<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSIMPI CUTZ | Admin</title><link rel="stylesheet" href="style.css"><style>.admin{width:min(1100px,94%);margin:40px auto}.adminbox{background:#111;border:1px solid #292929;padding:28px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #252525;padding:15px 0}.row:last-child{border-bottom:0}.pill{font-size:11px;color:#d6b36a;border:1px solid #4a3a1e;padding:5px 8px}.bookingrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:15px;align-items:center}.danger{background:#351414;color:#ff9a9a;border:1px solid #602020;padding:10px 14px;cursor:pointer}.small{font-size:12px;color:#999}.login{max-width:450px;margin:12vh auto}@media(max-width:700px){.bookingrow{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.admin{margin:20px auto}}</style></head><body><main class="admin"><div id="login" class="adminbox login"><div class="brand"><div class="logo">CC</div><b>CSIMPI CUTZ ADMIN</b></div><p class="small">Belépés a foglalások kezeléséhez.</p><input id="pass" type="password" placeholder="Admin jelszó"><button class="btn primary full" onclick="login()">BELÉPÉS</button><div id="loginmsg" class="message"></div></div><div id="dash" class="hidden"><div class="section-head"><div><span class="eyebrow">ADMIN</span><h2>Foglalások</h2></div><button class="btn primary" onclick="logout()">KILÉPÉS</button></div><div class="adminbox"><h3>Heti nyitvatartás</h3><div id="schedule"></div><button class="btn primary" onclick="saveSchedule()">MENTÉS</button><div id="schedmsg" class="message"></div></div><div class="adminbox" style="margin-top:20px"><h3>Foglalások</h3><div id="bookings"></div></div></div></main><script>
const tokenKey='csimpi_admin_token';let token=localStorage.getItem(tokenKey);const days=[['monday','Hétfő'],['tuesday','Kedd'],['wednesday','Szerda'],['thursday','Csütörtök'],['friday','Péntek']];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Admin-Token':token};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem(tokenKey);showLogin();throw Error('Nincs jogosultság.')}if(!r.ok)throw Error(d.error||'Hiba');return d}
function showLogin(){$('login').classList.remove('hidden');$('dash').classList.add('hidden')}function showDash(){$('login').classList.add('hidden');$('dash').classList.remove('hidden');loadAll()}
function $(id){return document.getElementById(id)}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem(tokenKey,token);showDash()}catch(e){$('loginmsg').textContent=e.message;$('loginmsg').className='message err'}}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}catch{}localStorage.removeItem(tokenKey);token=null;showLogin()}
async function loadAll(){try{const s=await api('/api/schedule');$('schedule').innerHTML=days.map(([k,n])=>`<div class="row"><b>${n}</b><label><input id="e-${k}" type="checkbox" ${s[k].enabled?'checked':''}> Nyitva</label><input id="s-${k}" type="time" value="${s[k].start}"><input id="x-${k}" type="time" value="${s[k].end}"></div>`).join('');const b=await api('/api/admin/bookings');$('bookings').innerHTML=b.length?b.map(x=>`<div class="row bookingrow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.phone)} · ${esc(x.email)}</div></div><div><span class="pill">${esc(x.date)} ${esc(x.time)}</span><div class="small">${esc(x.serviceName)} · ${Number(x.price).toLocaleString('hu-HU')} Ft</div></div><div class="small">${esc(x.note||'Nincs megjegyzés')}</div><button class="danger" onclick="del('${x.id}')">TÖRLÉS</button></div>`).join(''):'<p class="small">Nincs foglalás.</p>'}catch(e){$('bookings').innerHTML='<p class="message err">'+esc(e.message)+'</p>'}}
async function saveSchedule(){const body={};days.forEach(([k])=>body[k]={enabled:$('e-'+k).checked,start:$('s-'+k).value,end:$('x-'+k).value});try{await api('/api/admin/schedule',{method:'POST',body:JSON.stringify(body)});$('schedmsg').textContent='Nyitvatartás mentve.';$('schedmsg').className='message ok'}catch(e){$('schedmsg').textContent=e.message;$('schedmsg').className='message err'}}
async function del(id){if(!confirm('Biztosan törlöd ezt a foglalást?'))return;try{await api('/api/admin/bookings/'+id,{method:'DELETE'});loadAll()}catch(e){alert(e.message)}}
if(token)showDash();else showLogin();
</script></body></html>
